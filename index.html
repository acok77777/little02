
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6C9FD8">

  <title>리틀팍스 동화 레벨 2</title>
  <meta name="description" content="영어 동화 67편 · 듣기 · 읽기 · 해석을 한곳에서 학습하세요.">

  <!-- 카카오톡 및 메신저 공유 미리보기 -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="리틀팍스 동화 레벨 2">
  <meta property="og:title" content="📚 리틀팍스 동화 레벨 2">
  <meta property="og:description" content="영어 동화 67편! 듣고, 읽고, 뜻을 확인해 보세요.">
  <meta property="og:url" content="https://acok77777.github.io/little02/">
  <meta property="og:image" content="https://acok77777.github.io/little02/icon-512.png">
  <meta property="og:image:secure_url" content="https://acok77777.github.io/little02/icon-512.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">

  <!-- X 등 다른 공유 서비스용 -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="리틀팍스 동화 레벨 2">
  <meta name="twitter:description" content="영어 동화 67편 · 듣기 · 읽기 · 해석">
  <meta name="twitter:image" content="https://acok77777.github.io/little02/icon-512.png">

  <!-- 앱 아이콘 -->
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.json">

  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <header class="app-header">
    <h1>📚 리틀팍스 동화 레벨 2</h1>
    <p>영어 동화 67편 · 듣기 · 읽기 · 해석</p>
  </header>

  <main>
    <p id="errorMessage" hidden></p>

    <!-- 메인 화면 -->
    <section id="homeView">
      <div class="panel progress-panel">
        <div class="progress-text">
          <strong>나의 학습 진행률</strong>
          <strong id="progressCount">0 / 67</strong>
        </div>

        <div class="progress-track">
          <div id="progressBar"
               role="progressbar"
               aria-valuemin="0"
               aria-valuemax="67"
               aria-valuenow="0"></div>
        </div>

        <p id="progressPercent">0%</p>
      </div>

      <div class="panel hero">
        <div class="hero-icon">🚁</div>
        <h2>영어 동화 학습</h2>
        <p>원하는 동화 구간을 선택하세요.</p>

        <div class="range-buttons">
          <button class="range-card pink" data-range="1-20">
            <strong>1~20번</strong>
            <small>첫 번째 구간</small>
          </button>

          <button class="range-card blue" data-range="21-40">
            <strong>21~40번</strong>
            <small>두 번째 구간</small>
          </button>

          <button class="range-card green" data-range="41-60">
            <strong>41~60번</strong>
            <small>세 번째 구간</small>
          </button>

          <button class="range-card yellow" data-range="61-67">
            <strong>61~67번</strong>
            <small>네 번째 구간</small>
          </button>
        </div>
      </div>
    </section>

    <!-- 동화 목록 -->
    <section id="listView" hidden>
      <div class="panel">
        <div class="list-heading">
          <button id="homeButton">← 메인</button>
          <h2 id="rangeTitle">동화 목록</h2>
        </div>

        <div class="range-buttons list-ranges">
          <button class="range-card pink" data-range="1-20">1~20번</button>
          <button class="range-card blue" data-range="21-40">21~40번</button>
          <button class="range-card green" data-range="41-60">41~60번</button>
          <button class="range-card yellow" data-range="61-67">61~67번</button>
        </div>

        <div id="storyList"></div>
      </div>
    </section>

    <!-- 학습 화면 -->
    <section id="studyView" hidden>
      <div class="panel study-panel">
        <button id="listButton">← 동화 목록</button>

        <h2 id="studyTitle">동화</h2>

        <div class="mode-buttons">
          <button data-mode="both" class="active">영어 + 한국어</button>
          <button data-mode="en">영어만</button>
          <button data-mode="ko">한국어만</button>
        </div>

        <article id="storyContent"></article>

        <button id="completeButton" class="primary wide">
          ✓ 학습 완료 체크 저장
        </button>

        <div class="navigation">
          <button id="prevButton">← 이전 동화</button>
          <button id="nextButton">다음 동화 →</button>
        </div>
      </div>
    </section>
  </main>

  <!-- 하단 오디오 플레이어 -->
  <footer class="audio-dock">
    <div class="audio-inner">
      <div id="audioTitle">동화를 선택해 주세요.</div>

      <div class="audio-controls">
        <button id="playButton" class="primary">▶ 재생</button>
        <button id="stopButton">■ 정지</button>

        <select id="speedSelect" aria-label="재생 속도">
          <option value="0.5">0.5배속</option>
          <option value="0.75">0.75배속</option>
          <option value="1" selected>1배속</option>
          <option value="1.25">1.25배속</option>
          <option value="1.5">1.5배속</option>
          <option value="2">2배속</option>
          <option value="2.5">2.5배속</option>
        </select>
      </div>

      <input id="audioProgress"
             type="range"
             min="0"
             max="100"
             step="0.1"
             value="0"
             aria-label="오디오 재생 위치">

      <div class="time-row">
        <span id="currentTime">0:00</span>
        <span id="durationTime">0:00</span>
      </div>
    </div>
  </footer>

  <script src="./app.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js")
          .catch(error => console.error("서비스 워커 오류:", error));
      });
    }
  </script>
</body>
</html>
