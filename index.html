<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#315eb5"><meta name="description" content="리틀팍스 동화 레벨 2 영어 듣기 학습">
<link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="stylesheet" href="./style.css"><title>리틀팍스 동화 레벨 2</title></head>
<body>
<header class="topbar"><button id="homeBtn" class="icon-button">⌂</button><div class="brand"><span>📚</span><div><h1>리틀팍스 동화 레벨 2</h1><p>듣고 · 읽고 · 따라 말하기</p></div></div></header>
<main id="homeView" class="view"><section class="hero"><div><small>ENGLISH LISTENING</small><h2>오늘도 한 편씩,<br>영어와 친해지기</h2><p>듣고, 읽고, 소리 내어 따라 해요.</p></div><div class="hero-art">🦊📖</div></section>
<section class="range-grid"><button class="range-card pink" data-start="1" data-end="20"><strong>1~20번</strong><small>동화 학습하기</small></button><button class="range-card blue" data-start="21" data-end="40"><strong>21~40번</strong><small>동화 학습하기</small></button><button class="range-card green" data-start="41" data-end="60"><strong>41~60번</strong><small>동화 학습하기</small></button><button class="range-card yellow" data-start="61" data-end="67"><strong>61~67번</strong><small>동화 학습하기</small></button></section>
<section class="card"><div class="section-heading"><h2>나의 학습 현황</h2><strong id="progressText">0 / 67 완료</strong></div><div class="progress-track"><div id="progressFill"></div></div><p id="progressSub">저장한 동화가 여기에 표시돼요.</p></section>
<section class="card"><div class="section-heading"><h2>최근 학습한 동화</h2><button id="showAllBtn" class="text-button">전체 목록</button></div><div id="recentList" class="recent-list">아직 학습한 동화가 없어요.</div></section></main>
<main id="listView" class="view hidden"><div class="page-heading"><button id="listBackBtn" class="back-button">← 메인</button><div><h2 id="listTitle">동화 목록</h2><p id="listSubtitle"></p></div></div><div id="storyList" class="story-list"></div></main>
<main id="studyView" class="view study-view hidden"><div class="study-heading"><button id="studyBackBtn" class="back-button">← 목록</button><span id="studyNumber" class="story-number">001</span><h2 id="studyTitle">동화 제목</h2><button id="headerSaved" class="save-chip">♡ 저장</button></div>
<section class="player-card"><div class="player-main"><button id="playBtn" class="play-button" aria-label="재생">▶</button><div class="timeline-wrap"><div class="time-row"><span id="currentTime">00:00</span><span id="duration">00:00</span></div><input id="seekBar" type="range" min="0" max="100" value="0" aria-label="재생 위치"></div></div>
<div class="speed-row"><span>속도 조절</span><button id="slowerBtn" class="speed-arrow" aria-label="0.5배 느리게">−</button><strong id="speedValue">1.0×</strong><button id="fasterBtn" class="speed-arrow" aria-label="0.5배 빠르게">＋</button></div><p id="audioStatus" class="audio-status">음성 파일을 불러오는 중이에요.</p><audio id="audio" preload="metadata"></audio></section>
<div class="mode-tabs"><button class="mode-tab active" data-mode="both">영어 + 해석</button><button class="mode-tab" data-mode="en">영어만</button><button class="mode-tab" data-mode="ko">해석만</button></div>
<section id="storyContent" class="story-content"></section><nav class="study-nav"><button id="prevBtn" class="nav-button">← 이전</button><button id="backToListBtn" class="nav-button neutral">목록으로</button><button id="nextBtn" class="nav-button next">다음 →</button></nav><button id="saveBtn" class="save-main">♡ 이 동화 저장하기</button><p class="save-note">저장하면 메인 화면과 단원 목록에 완료 표시가 돼요.</p></main>
<footer><span>Littlefox Level 2 · 개인 학습용</span><button id="resetProgressBtn" class="text-button">학습 기록 초기화</button></footer><div id="toast" class="toast"></div><script src="./app.js"></script></body></html>
